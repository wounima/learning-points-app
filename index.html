<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><title>學習點數銀行</title><meta name="theme-color" content="#344c99"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="學習點數銀行"><link rel="manifest" href="manifest.webmanifest"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;color:#1b2940;background:#f3f6fb}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}header{background:linear-gradient(120deg,#344c99,#657bd0);color:white;padding:22px 18px 20px}header h1{margin:0;font-size:23px}header p{margin:6px 0 0;opacity:.85;font-size:13px}.wrap{max-width:740px;margin:auto;padding:14px 14px 70px}.tabs{display:flex;gap:6px;overflow:auto;padding:8px 0 12px;position:sticky;top:0;background:#f3f6fb;z-index:5}.tabs button{flex:0 0 auto;border:0;border-radius:24px;background:#e2e8f6;padding:10px 14px;font-weight:700;color:#364b78}.tabs button.active{background:#344c99;color:white}.card{background:white;border-radius:17px;padding:17px;margin-bottom:13px;box-shadow:0 3px 12px #24375b0b}.card h2{font-size:17px;margin:0 0 13px}.muted{font-size:13px;color:#66738b}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.spread{justify-content:space-between}.field{margin-bottom:12px;flex:1 1 145px}label{display:block;font-size:13px;color:#58647a;margin-bottom:5px;font-weight:650}input,select,textarea{width:100%;border:1px solid #d5ddeb;border-radius:10px;padding:11px;background:#fff;font:inherit;color:#17253e}textarea{min-height:65px}button{font:inherit;cursor:pointer}button.primary{background:#405bbb;color:white;border:0;border-radius:11px;padding:11px 16px;font-weight:750}button.secondary{background:#eaf0ff;color:#314b96;border:0;border-radius:11px;padding:10px 13px;font-weight:700}button.danger{background:#fff0f0;color:#ad3333;border:0;border-radius:10px;padding:9px 11px}.big{font-size:36px;font-weight:850;color:#334da5}.child{flex:1;min-width:140px;padding:14px;border:1px solid #e1e7f2;border-radius:13px}.child strong{font-size:17px}.child small{display:block;color:#718099;margin-top:3px}.tag{display:inline-block;padding:4px 8px;background:#edf2ff;border-radius:7px;font-size:12px;color:#39549a}.entry{padding:12px 0;border-bottom:1px solid #eef1f6}.entry:last-child{border:0}.amount{font-weight:800;font-size:17px}.positive{color:#138261}.negative{color:#c14a4a}.notice{border-left:4px solid #e2a52f;background:#fff7e6;padding:12px;border-radius:9px;margin:10px 0;font-size:13px}.good{border-left-color:#278a6b;background:#eefaf5}.hidden{display:none!important}.hint{font-size:12px;color:#6b778e;margin-top:6px}.mini{font-size:12px;padding:5px 8px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.pill{border:1px solid #dbe2ef;border-radius:12px;padding:10px}.pill strong{display:block}hr{border:0;border-top:1px solid #edf0f6;margin:16px 0}@media(max-width:400px){.wrap{padding:10px 10px 60px}.card{padding:14px}.big{font-size:30px}}
</style></head><body><header><div style="max-width:740px;margin:auto"><h1>⭐ 學習點數銀行</h1><p>Ellison × Emerson｜本機儲存・每週備份提醒</p></div></header><div class="wrap"><div id="storageNotice"></div><nav class="tabs" id="tabs"></nav><main id="content"></main></div><script>
(()=>{'use strict';
const KEY='learning-points-bank-local-v1';const iso=()=>new Date().toLocaleDateString('sv-SE');const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>(n>0?'+':'')+Number(n).toLocaleString('zh-TW');
const initial=()=>({version:1,children:[{id:'ellison',name:'Ellison'},{id:'emerson',name:'Emerson'}],subjects:[{id:'chinese',name:'國語',high:90,low:80,highMul:1,lowMul:1,enabled:true},{id:'math',name:'數學',high:90,low:80,highMul:1,lowMul:1,enabled:true},{id:'english',name:'英文',high:90,low:80,highMul:1,lowMul:1,enabled:true},{id:'science',name:'自然',high:90,low:80,highMul:1,lowMul:1,enabled:true},{id:'social',name:'社會',high:90,low:80,highMul:1,lowMul:1,enabled:true}],presets:[{id:'reading',name:'主動閱讀',points:20},{id:'homework',name:'準時完成作業',points:10},{id:'late',name:'未完成作業',points:-20}],rewards:[{id:'small',name:'小禮物',cost:300},{id:'outing',name:'特別活動',cost:1000}],entries:[],lastBackup:null,createdAt:new Date().toISOString()});
let data;let storageOK=true;try{const raw=localStorage.getItem(KEY);data=raw?JSON.parse(raw):initial();if(!raw)localStorage.setItem(KEY,JSON.stringify(data));}catch(e){data=initial();storageOK=false;}if(!data||!Array.isArray(data.entries)||!Array.isArray(data.children)||!Array.isArray(data.subjects))data=initial();
let tab='overview',chosen='ellison';const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data));storageOK=true;return true}catch(e){storageOK=false;alert('無法保存到手機儲存空間！請立刻使用「匯出備份」，避免資料遺失。');return false}};
const balance=id=>data.entries.filter(e=>e.childId===id).reduce((a,e)=>a+Number(e.points||0),0);const childName=id=>data.children.find(x=>x.id===id)?.name||id;const subName=id=>data.subjects.find(x=>x.id===id)?.name||'已刪除科目';const backupDays=()=>data.lastBackup?Math.floor((Date.now()-new Date(data.lastBackup).getTime())/86400000):null;
const card=(title,body)=>`<section class="card"><h2>${title}</h2>${body}</section>`;const btn=(text,fn,cls='secondary')=>`<button class="${cls}" onclick="app.${fn}">${text}</button>`;
const opts=(items,selected)=>items.map(x=>`<option value="${esc(x.id)}" ${x.id===selected?'selected':''}>${esc(x.name)}</option>`).join('');
function render(){const days=backupDays();document.getElementById('storageNotice').innerHTML=(!storageOK?'<div class="notice">⚠️ 目前無法確認本機資料能正常儲存。請勿依賴此檔案保存唯一紀錄，立即匯出備份。</div>':'')+(days===null||days>=7?`<div class="notice">⚠️ ${days===null?'尚未建立備份':`距離上次備份已 ${days} 天`}。建議每週匯出 JSON 備份到「檔案 → iCloud Drive」。 ${btn('前往備份',"go('backup')")}</div>`:'');const tabs=[['overview','總覽'],['grade','成績'],['extra','額外加減'],['redeem','兌換'],['history','紀錄'],['rules','規則設定'],['backup','備份']];document.getElementById('tabs').innerHTML=tabs.map(([id,name])=>`<button class="${tab===id?'active':''}" onclick="app.go('${id}')">${name}</button>`).join('');const f={overview,grade,extra,redeem,history,rules,backup};document.getElementById('content').innerHTML=f[tab]();}
function overview(){return card('兩位孩子的點數',`<div class="row">${data.children.map(c=>`<div class="child"><strong>${esc(c.name)}</strong><small>目前餘額</small><div class="big">${money(balance(c.id))}</div><span class="tag">${data.entries.filter(e=>e.childId===c.id).length} 筆紀錄</span></div>`).join('')}</div>`)+card('最近紀錄',entries(data.entries.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt.localeCompare(a.createdAt)).slice(0,8)))+card('快速操作',`<div class="row">${btn('新增成績',"go('grade')",'primary')}${btn('額外加減點',"go('extra')")}${btn('匯出備份',"go('backup')")}</div>`)}
function entries(list){return list.length?list.map(e=>`<div class="entry"><div class="row spread"><div><strong>${esc(childName(e.childId))}</strong> · ${esc(e.label)}<div class="muted">${esc(e.date)} ${e.score!==undefined?' · '+esc(e.score)+' 分':''} ${e.note?' · '+esc(e.note):''}</div></div><div class="row"><span class="amount ${e.points>=0?'positive':'negative'}">${money(e.points)}</span><button class="danger mini" onclick="app.removeEntry('${esc(e.id)}')">刪除</button></div></div></div>`).join(''):'<p class="muted">目前沒有紀錄。</p>'}
function grade(){const subs=data.subjects.filter(x=>x.enabled);return card('新增考試成績',`<form onsubmit="app.addGrade(event)"><div class="row"><div class="field"><label>孩子</label><select name="childId" required>${opts(data.children,chosen)}</select></div><div class="field"><label>日期</label><input type="date" name="date" value="${iso()}" required></div></div><div class="row"><div class="field"><label>科目</label><select name="subjectId" required>${opts(subs,subs[0]?.id)}</select></div><div class="field"><label>考試分數（0～100）</label><input name="score" type="number" min="0" max="100" step="0.01" required placeholder="例如 95"></div></div><div class="field"><label>備註（選填）</label><input name="note" placeholder="例如 第一次段考"></div><button class="primary" type="submit">計算並記錄點數</button></form><p class="hint">計分以新增當下的科目規則為準；之後修改公式不會追溯變更既有紀錄。</p>`)+card('計分方式',`<p class="muted">分數 ≥ 高分門檻：依達到的最高門檻計算「分數 × 該級倍率」；分數 ＜ 低分門檻：扣除「(低分門檻 − 分數) × 扣分倍率」；中間區間為 0 點。計算後四捨五入為整數。</p>`)}
function extra(){return card('額外加分／扣分',`<form onsubmit="app.addExtra(event)"><div class="row"><div class="field"><label>孩子</label><select name="childId">${opts(data.children,chosen)}</select></div><div class="field"><label>日期</label><input type="date" name="date" value="${iso()}" required></div></div><div class="field"><label>選擇預設事項</label><select name="preset" onchange="app.pickPreset(this)"><option value="">自行輸入</option>${opts(data.presets,'')}</select></div><div class="field"><label>事項名稱</label><input name="label" required placeholder="例如 幫忙做家事"></div><div class="field"><label>點數（負數表示扣分）</label><input name="points" type="number" step="1" required placeholder="例如 20 或 -10"></div><div class="field"><label>備註（選填）</label><input name="note"></div><button class="primary" type="submit">儲存加減點</button></form>`)}
function redeem(){return card('兌換獎勵',`<form onsubmit="app.addRedeem(event)"><div class="row"><div class="field"><label>孩子</label><select name="childId">${opts(data.children,chosen)}</select></div><div class="field"><label>日期</label><input type="date" name="date" value="${iso()}" required></div></div><div class="field"><label>獎勵</label><select name="rewardId">${opts(data.rewards,'')}</select></div><div class="field"><label>備註</label><input name="note" placeholder="選填"></div><button class="primary" type="submit">確認兌換並扣點</button></form><p class="hint">兌換會記錄負點數。若餘額不足，系統會先提醒並由家長決定是否允許。</p>`)+card('獎勵清單',data.rewards.map(r=>`<div class="entry"><strong>${esc(r.name)}</strong> · ${money(r.cost)} 點</div>`).join('')||'<p class="muted">尚無獎勵。</p>')}
function history(){const children=[{id:'all',name:'全部'},...data.children];return card('所有異動紀錄',`<div class="field"><label>篩選孩子</label><select id="historyChild" onchange="app.filterHistory(this.value)">${opts(children,window.historyFilter||'all')}</select></div><div id="historyList">${entries(data.entries.filter(e=>!window.historyFilter||window.historyFilter==='all'||e.childId===window.historyFilter).slice().sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt.localeCompare(a.createdAt)))}</div>`)}
function tierRow(threshold='',multiplier=2){return `<div class="row tier-row" style="margin-bottom:8px;align-items:end"><div class="field" style="margin:0"><label>分數達到（≥）</label><input class="tier-threshold" type="number" min="0" max="100" step="0.01" value="${esc(threshold)}" required></div><div class="field" style="margin:0"><label>獎勵倍率</label><input class="tier-multiplier" type="number" min="0" max="100" step="0.1" value="${esc(multiplier)}" required></div><button type="button" class="danger mini" onclick="this.closest('.tier-row').remove()">移除</button></div>`}
function penaltyRow(threshold='',multiplier=2){return `<div class="row penalty-row" style="margin-bottom:8px;align-items:end"><div class="field" style="margin:0"><label>分數低於（＜）</label><input class="penalty-threshold" type="number" min="0" max="100" step="0.01" value="${esc(threshold)}" required></div><div class="field" style="margin:0"><label>扣點倍率</label><input class="penalty-multiplier" type="number" min="0" max="100" step="0.1" value="${esc(multiplier)}" required></div><button type="button" class="danger mini" onclick="this.closest('.penalty-row').remove()">移除</button></div>`}
function calcGrade(score,s){const tier=(s.bonusTiers||[]).filter(t=>score>=Number(t.threshold)).sort((a,b)=>Number(b.threshold)-Number(a.threshold))[0];const penalty=(s.penaltyTiers||[]).filter(t=>score<Number(t.threshold)).sort((a,b)=>Number(a.threshold)-Number(b.threshold))[0];return score>=s.high?Math.round(score*(tier?Number(tier.multiplier):s.highMul)):score<s.low?-Math.round((s.low-score)*(penalty?Number(penalty.multiplier):s.lowMul)):0}
function rules(){return card('各科計分規則',`<p class="muted">門檻與倍率可隨時調整。高分門檻需大於低分門檻。</p>${data.subjects.map(s=>`<form onsubmit="app.saveSubject(event,'${esc(s.id)}')"><div class="pill"><div class="row"><div class="field"><label>科目名稱</label><input name="name" value="${esc(s.name)}" required></div><div class="field"><label>狀態</label><select name="enabled"><option value="true" ${s.enabled?'selected':''}>啟用</option><option value="false" ${!s.enabled?'selected':''}>停用</option></select></div></div><div class="grid"><div><label>高分門檻（≥）</label><input name="high" type="number" min="0" max="100" value="${s.high}" required></div><div><label>低分門檻（＜）</label><input name="low" type="number" min="0" max="100" value="${s.low}" required></div><div><label>高分倍率</label><input name="highMul" type="number" min="0" step="0.1" value="${s.highMul}" required></div><div><label>扣分倍率</label><input name="lowMul" type="number" min="0" step="0.1" value="${s.lowMul}" required></div></div><div class="field" style="margin-top:12px"><label>進階高分獎勵（可增加多個級距）</label><p class="hint">達到門檻時使用最高符合級距的倍率；例如 95 分 ×2、98 分 ×3。未達進階門檻時沿用上方的一般高分倍率。</p><div id="tiers-${esc(s.id)}">${(s.bonusTiers||[]).map(t=>tierRow(t.threshold,t.multiplier)).join('')}</div><button type="button" class="secondary mini" onclick="app.addTier('${esc(s.id)}')">＋ 新增高分級距</button></div><div class="field" style="margin-top:12px"><label>進階低分加重扣點（可增加多個級距）</label><p class="hint">低於設定分數時，使用符合條件中最低門檻的倍率。扣點仍以（一般低分門檻－實際分數）計算，例如低於 70 分 ×2、低於 60 分 ×3。</p><div id="penalties-${esc(s.id)}">${(s.penaltyTiers||[]).map(t=>penaltyRow(t.threshold,t.multiplier)).join('')}</div><button type="button" class="secondary mini" onclick="app.addPenalty('${esc(s.id)}')">＋ 新增低分扣點級距</button></div><div class="row" style="margin-top:9px"><button class="secondary" type="submit">儲存科目</button><button class="danger" type="button" onclick="app.removeSubject('${esc(s.id)}')">刪除</button></div></div></form><div style="height:9px"></div>`).join('')}<form onsubmit="app.addSubject(event)"><div class="row"><div class="field"><label>新增科目名稱</label><input name="name" required placeholder="例如 地理"></div><button class="primary" type="submit">新增科目</button></div></form>`)+card('額外事項預設',`${data.presets.map(p=>`<div class="entry row spread"><span>${esc(p.name)} <b class="${p.points>=0?'positive':'negative'}">${money(p.points)}</b></span><button class="danger mini" onclick="app.removePreset('${esc(p.id)}')">刪除</button></div>`).join('')}<form onsubmit="app.addPreset(event)"><div class="row"><div class="field"><label>事項名稱</label><input name="name" required></div><div class="field"><label>點數</label><input name="points" type="number" step="1" required></div></div><button class="secondary" type="submit">新增預設</button></form>`)+card('獎勵設定',`${data.rewards.map(r=>`<div class="entry row spread"><span>${esc(r.name)} · ${money(r.cost)} 點</span><button class="danger mini" onclick="app.removeReward('${esc(r.id)}')">刪除</button></div>`).join('')}<form onsubmit="app.addReward(event)"><div class="row"><div class="field"><label>獎勵名稱</label><input name="name" required></div><div class="field"><label>所需點數</label><input name="cost" type="number" min="1" step="1" required></div></div><button class="secondary" type="submit">新增獎勵</button></form>`)}
function backup(){const days=backupDays();return card('備份與還原',`<div class="notice ${days!==null&&days<7?'good':''}">${days===null?'尚未備份過。':`上次匯出備份：${new Date(data.lastBackup).toLocaleString('zh-TW')}（${days} 天前）`}</div><p>建議每週、每次大量輸入成績後，都匯出一次 JSON 備份，儲存到 iCloud Drive 或其他安全位置。</p><div class="row">${btn('⬇ 匯出 JSON 備份','exportData()','primary')}</div><hr><label>從備份檔還原</label><input type="file" id="restoreFile" accept=".json,application/json"><p class="hint">匯入會取代手機目前的全部資料。請先匯出目前資料再還原。</p>${btn('匯入並還原','importData()')}<hr><p class="muted">此 App 不連接伺服器；資料儲存在開啟此 HTML 的瀏覽器儲存空間。iPhone 的「檔案」預覽可能不允許持久儲存，或每次開啟時使用不同儲存環境。請不要將本機紀錄當成唯一備份。</p>`)+card('儲存狀態',`<p>${storageOK?'目前寫入測試未回報錯誤，但無法保證 iOS 檔案預覽長期保留資料。':'⚠️ 無法正常使用本機儲存，請立即備份。'}</p><p class="muted">紀錄共 ${data.entries.length} 筆。最後提醒：匯出備份後，請確認「檔案」App 裡確實有 JSON 檔案。</p>`)}
const form=e=>Object.fromEntries(new FormData(e.target).entries());const commit=()=>{save();render()};const addEntry=e=>{data.entries.push({id:uid(),createdAt:new Date().toISOString(),...e});commit()};
window.app={go:t=>{tab=t;render();window.scrollTo(0,0)},addGrade:e=>{e.preventDefault();const v=form(e),s=data.subjects.find(x=>x.id===v.subjectId),score=Number(v.score);if(!s||score<0||score>100||!Number.isFinite(score))return alert('請輸入 0～100 的分數');let points=calcGrade(score,s);chosen=v.childId;addEntry({childId:v.childId,date:v.date,type:'grade',subjectId:s.id,label:subName(s.id),score,points,note:v.note,ruleSnapshot:{high:s.high,low:s.low,highMul:s.highMul,lowMul:s.lowMul,bonusTiers:(s.bonusTiers||[]).map(t=>({...t})),penaltyTiers:(s.penaltyTiers||[]).map(t=>({...t}))}});alert(`已記錄 ${esc(childName(v.childId))}：${score} 分，${money(points)} 點`)},pickPreset:sel=>{const p=data.presets.find(x=>x.id===sel.value),f=sel.form;if(p){f.elements.label.value=p.name;f.elements.points.value=p.points}},addExtra:e=>{e.preventDefault();const v=form(e);chosen=v.childId;addEntry({childId:v.childId,date:v.date,type:'extra',label:v.label.trim(),points:Number(v.points),note:v.note});alert('已儲存')},addRedeem:e=>{e.preventDefault();const v=form(e),r=data.rewards.find(x=>x.id===v.rewardId);if(!r)return alert('請先建立獎勵');if(balance(v.childId)<r.cost&&!confirm('目前點數不足，仍要兌換並讓餘額變成負數嗎？'))return;chosen=v.childId;addEntry({childId:v.childId,date:v.date,type:'redeem',label:'兌換：'+r.name,points:-r.cost,note:v.note});alert('兌換已記錄')},removeEntry:id=>{if(confirm('確定刪除這筆紀錄？刪除後餘額會重新計算。')){data.entries=data.entries.filter(e=>e.id!==id);commit()}},filterHistory:id=>{window.historyFilter=id;document.getElementById('historyList').innerHTML=entries(data.entries.filter(e=>id==='all'||e.childId===id).slice().sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt.localeCompare(a.createdAt)))},addTier:id=>{const container=document.getElementById('tiers-'+id);if(container)container.insertAdjacentHTML('beforeend',tierRow())},addPenalty:id=>{const container=document.getElementById('penalties-'+id);if(container)container.insertAdjacentHTML('beforeend',penaltyRow())},saveSubject:(e,id)=>{e.preventDefault();const v=form(e
